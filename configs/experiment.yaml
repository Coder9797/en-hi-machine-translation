seed: 42
dataset_id: cfilt/iitb-english-hindi
dataset_page: https://www.cfilt.iitb.ac.in/iitb_parallel/
dataset_mirror: https://huggingface.co/datasets/cfilt/iitb-english-hindi
train_size: 8000
val_size: 1000
test_size: 1000
max_words: 40
max_chars: 240
length_ratio: 4.0
sp_vocab_size: 8000
max_len: 64
beam_size: 4
speed_sentences: 100
temperature_sentences: 100
temperatures: [0.3, 0.7, 1.0, 1.3]
sample_rows: 25

transformer:
  d_model: 256
  nhead: 4
  num_layers: 3
  d_ff: 512
  dropout: 0.1
  epochs: 8
  batch_size: 64
  lr: 0.0003
  warmup_steps: 200
  patience: 2
  label_smoothing: 0.1
  clip: 1.0

mt5:
  model_name: google/mt5-small
  epochs: 1
  batch_size: 4
  grad_accum: 4
  lr: 0.0001
  warmup_steps: 50
  clip: 1.0
  eval_examples: 200

decoder:
  max_len: 192
  epochs: 1
  batch_size: 1
  grad_accum: 16
  lr: 0.0002
  warmup_steps: 30
  clip: 1.0
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  eval_examples: 64
  log_every: 25
  models:
    gemma: google/gemma-2-2b-it
    llama: meta-llama/Llama-3.2-1B-Instruct

prompt: "Translate this English sentence into Hindi. Reply with only the Hindi translation.\n{sentence}"
mt5_prefix: "translate English to Hindi: "
